[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cadello"
version = "0.1.0"  # the package; model versions (wren-1.5, ...) are separate
description = "Cadello: a family of 1 to 5 star sentiment models written from scratch in NumPy."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24"]

[project.scripts]
cadello = "cadello.cli:main"
wren = "cadello.cli:wren_main"  # deprecated alias, remove in a later release

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
train = ["rich>=13"]  # live dashboard for `cadello train` / `cadello watch`
